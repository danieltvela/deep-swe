# Model registry for local DeepSWE evaluations.
#
# Each key is a model id you pass to `deepswe_eval.py run --model <id>`.
# The four identity fields (name, quantization, lab, variant) are stored with
# every run and shown in the HTML report; edit them to match what you are
# actually evaluating.
#
# The `serving` block records the deployment configuration that also drives
# quality and speed: context length, KV-cache dtype, tensor parallelism, GPUs,
# reasoning budget and serving stack. Fill it in per model; unknown values stay
# as "unspecified". `reasoning_effort` is also read from the agent kwargs, so
# whatever is actually sent is recorded.
#
# Networking: task containers have no direct internet access. pier routes model
# traffic through an egress proxy that only permits ports 80 and 443, so the
# harness exposes the model gateway on the docker bridge gateway at port 80
# (`deepswe_eval.py forwarder start`, target 127.0.0.1:4000 by default).
# `172.17.0.1.nip.io` resolves to that gateway. `model_class: litellm` forces
# the chat-completions adapter; without it, mini-swe-agent picks the OpenAI
# Responses adapter for `openai/...` models.
#
# `env` values support ${VAR} and ${VAR:-default} expansion from your shell.
#
# Optional `agent.verify_served_alias: true` makes the nightly runner require the
# endpoint to advertise the requested alias on /v1/models before it starts a
# batch. Set it when another server can hold the same port: sglang answers 200
# for any model name, so a chat probe alone would pass while the wrong model is
# the one serving.

models:
  # Routed through LiteLLM (the default forwarder target).
  # Values below come from ~/services/tesla-docker/docker-compose.yml
  # (profile "mimo": MiMo-V2.6-Flash-MOPD, TP=2, DFlash speculative decoding).
  mimo-v2.6-flash:
    name: MiMo-V2.6-Flash-MOPD
    quantization: "W4A8 (MXFP4 experts + FP8 dense)"
    lab: Xiaomi
    variant: MOPD
    serving:
      context_length: 448512
      kv_cache_dtype: fp8
      tensor_parallel: 2
      gpus: "2x RTX PRO 6000 Blackwell Max-Q"
      reasoning_effort: unspecified
      stack: "vLLM (mimo-v26-omni image, DFlash spec decode, kv-offloading)"
      notes: "309B/15B active MoE; profile 'mimo' uses both GPUs exclusively"
    agent:
      name: mini-swe-agent
      model_name: openai/swe-agentic
      env:
        OPENAI_BASE_URL: http://172.17.0.1.nip.io/v1
        OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
        MSWEA_API_KEY: ${LITELLM_MASTER_KEY}
      kwargs:
        model_class: litellm

  gemma4-31b:
    name: gemma4-31b
    quantization: unspecified
    lab: Google
    variant: instruct
    serving:
      context_length: unspecified
      kv_cache_dtype: unspecified
      tensor_parallel: unspecified
      gpus: unspecified
      reasoning_effort: unspecified
      stack: vLLM
      notes: ""
    agent:
      name: mini-swe-agent
      model_name: openai/chat-agentic
      env:
        OPENAI_BASE_URL: http://172.17.0.1.nip.io/v1
        OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
        MSWEA_API_KEY: ${LITELLM_MASTER_KEY}
      kwargs:
        model_class: litellm

  # GLM-5.3-Flash, served by sglang on port 8005 under the `swe-agentic` profile
  # (mutually exclusive with the mimo profile: same GPUs, same port).
  #   docker compose --profile swe-agentic up -d glm53-flash-sm120
  # This entry uses the direct path: point the forwarder at the model server
  #   python3 eval/deepswe_eval.py forwarder start --target 127.0.0.1:8005
  # (the alternative is to add a LiteLLM alias and use openai/<alias>).
  glm-5.3-flash:
    name: GLM-5.3-Flash
    quantization: "W4A16 NVFP4 (K32 experts) + FP8 WO"
    lab: Zhipu AI
    variant: Flash
    serving:
      context_length: 524288
      kv_cache_dtype: fp8_e4m3
      tensor_parallel: 2
      gpus: "2x RTX PRO 6000 Blackwell Max-Q"
      reasoning_effort: unspecified
      stack: "sglang (sglang-glm53-flash-sm120, EAGLE spec decode)"
      notes: "profile 'swe-agentic'; same port as mimo, so the two cannot run together"
    agent:
      name: mini-swe-agent
      model_name: openai/glm-5.3-flash-local
      env:
        OPENAI_BASE_URL: http://172.17.0.1.nip.io/v1
        OPENAI_API_KEY: dummy
        MSWEA_API_KEY: dummy
      kwargs:
        model_class: litellm

  # Qwen3.8-Flash-Next, served by vLLM on port 8005 (container vllm-qwen-flash-next).
  # Direct path: the forwarder must point at the model server
  #   python3 eval/deepswe_eval.py forwarder start --target 127.0.0.1:8005
  # Launched from ~/services/tesla-docker (profile "hybrid", manual):
  #   docker compose --profile hybrid up -d vllm-qwen-flash-nvfp4
  # Deployment since 2026-10-15: TP=2 on both GPUs (the 123.6 GiB of weights do
  # not fit on one 96 GB card). The five Rust tasks of 2026-10-09/10 were run
  # under the earlier TP=1 deployment; the stored serving block of those runs
  # still says tensor_parallel 1, and only speed differs between the two.
  qwen3.8-flash-next:
    name: Qwen3.8-Flash-Next
    quantization: "NVFP4 (vLLM --quantization modelopt)"
    lab: Alibaba
    variant: Flash
    serving:
      context_length: 262144
      kv_cache_dtype: unspecified
      tensor_parallel: 2
      gpus: "2x RTX PRO 6000 Blackwell Max-Q"
      reasoning_effort: unspecified
      stack: "vLLM (vllm/vllm-openai:nightly, MTP speculative decode x3)"
      notes: "port 8005; TP=2; prefix caching + chunked prefill + async scheduling; --max-num-seqs 4; qwen3 reasoning and qwen3_coder tool parsers"
    agent:
      name: mini-swe-agent
      model_name: openai/qwen3.8-flash-next
      env:
        OPENAI_BASE_URL: http://172.17.0.1.nip.io/v1
        OPENAI_API_KEY: dummy
        MSWEA_API_KEY: dummy
      kwargs:
        model_class: litellm

  # Qwen3.8-Flash-Next-FP4-Local: NVIDIA's NVFP4/CSF checkpoint of the same
  # model as `qwen3.8-flash-next`, served on port 8005 by the community image
  # that can read the compressed CSF scales.
  # Two deployments, both from ~/services/tesla-docker (manual profiles):
  #   TP=1, 262144 context, GPU 0  -> profile qwen38-fp4-local
  #     (2026-10-16 phase 1: 25 tasks measured, then stopped to widen the window)
  #   TP=2, 1048576 context, both GPUs -> profile qwen38-fp4-local-tp2
  #     docker compose --profile qwen38-fp4-local-tp2 up -d qwen38-flash-next-fp4-local-tp2
  # A single GPU cannot hold a 1M session (its pool is ~795K tokens), so the
  # long-context runs need TP=2; the serving block below describes TP=2.
  # Two things matter for the harness:
  #   * the server advertises the alias `qwen38-flash-next` (not
  #     `qwen3.8-flash-next`), so the agent must request that exact name;
  #   * the 51B n-gram embedding (PLE) table lives in host RAM (~27 GiB) and the
  #     96 GiB checkpoint streams through page cache while loading, so the
  #     machine needs its RAM to itself (`free -g`; with GLM loaded only 16 GB
  #     were available on 2026-10-16).
  # The forwarder already targets 8005, so it needs no repointing.
  qwen3.8-flash-next-fp4-local:
    name: Qwen3.8-Flash-Next-FP4-Local
    quantization: "NVFP4 CSF (NVIDIA ModelOpt v0.47.0, QAD FP4 1.0)"
    lab: Alibaba
    variant: Flash
    serving:
      context_length: 1048576
      kv_cache_dtype: fp8
      tensor_parallel: 2
      gpus: "2x RTX PRO 6000 Blackwell Max-Q"
      reasoning_effort: unspecified
      stack: "vLLM (ghcr.io/local-inference-lab/vllm:release-10152026, lil-serve preset qwen38-tp2, b12x backends, MTP x3)"
      notes: "port 8005; 1M context via YaRN factor 4 over the 262144 config positions; pool 6328464 tokens = 6.04x of 1M per request; --max-num-seqs 4; mamba-cache-mode align; PLE table in host RAM; qwen3_xml tool parser"
    agent:
      name: mini-swe-agent
      model_name: openai/qwen38-flash-next
      # The GLM server (sglang) answers any requested model name on port 8005,
      # so the chat probe alone cannot tell whether this model is the one up.
      verify_served_alias: true
      env:
        OPENAI_BASE_URL: http://172.17.0.1.nip.io/v1
        OPENAI_API_KEY: dummy
        MSWEA_API_KEY: dummy
      kwargs:
        model_class: litellm

  # Laguna-S-2.1, served by vLLM on port 8005 (container laguna-s-2.1-nvfp4).
  # Direct path: the forwarder must point at the model server
  #   python3 eval/deepswe_eval.py forwarder start --target 127.0.0.1:8005
  # NOTE: this server returns its thinking in a non-standard `reasoning` field and
  # always reports reasoning_tokens = 0, so the reasoning metrics will read zero.
  laguna-s-2.1:
    name: Laguna-S-2.1
    quantization: "NVFP4"
    lab: Poolside
    variant: S
    serving:
      context_length: 1048576
      kv_cache_dtype: fp8
      tensor_parallel: 2
      gpus: "2x RTX PRO 6000 Blackwell Max-Q"
      reasoning_effort: "enable_thinking=true (chat template)"
      stack: "vLLM (vllm/vllm-openai:nightly, DFlash speculative decode x7 from /draft)"
      notes: "port 8005; prefix caching + chunked prefill; --max-num-seqs 4; poolside_v1 reasoning and tool parsers; --disable-custom-all-reduce"
    agent:
      name: mini-swe-agent
      model_name: openai/laguna-s-2.1
      env:
        OPENAI_BASE_URL: http://172.17.0.1.nip.io/v1
        OPENAI_API_KEY: dummy
        MSWEA_API_KEY: dummy
      kwargs:
        model_class: litellm

  # Direct vLLM, bypassing LiteLLM. Start the forwarder with
  #   python3 eval/deepswe_eval.py forwarder start --target 127.0.0.1:8005
  mimo-v2.6-flash-direct:
    name: mimo-v2.6-flash
    quantization: unspecified
    lab: Xiaomi
    variant: flash
    serving:
      context_length: 448512
      kv_cache_dtype: unspecified
      tensor_parallel: unspecified
      gpus: unspecified
      reasoning_effort: unspecified
      stack: vLLM
      notes: "direct vLLM endpoint, no LiteLLM"
    agent:
      name: mini-swe-agent
      model_name: openai/mimo-v2.6-flash
      env:
        OPENAI_BASE_URL: http://172.17.0.1.nip.io/v1
        OPENAI_API_KEY: dummy
        MSWEA_API_KEY: dummy
      kwargs:
        model_class: litellm
